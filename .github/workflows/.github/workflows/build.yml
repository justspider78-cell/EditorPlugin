name: Build EditorPlugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build plugin
        uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: gradle build

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: EditorPlugin
          path: build/libs/*.jar
