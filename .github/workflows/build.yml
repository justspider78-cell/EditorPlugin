
name: Build EditorPlugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build plugin
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: EditorPlugin
          path: build/libs/*.jar
          
